</head>

<div class="app-content">

<header class="page-header">
  <div class="page-header-top">
    <h1>Delivery Partners</h1>
    <span class="live-pill"><span class="live-dot"></span>Live</span>
  </div>
  <p>Onboard riders and track who's carrying an active load right now.</p>
</header>

<div class="stat-row" id="statRow">
  <div class="stat-card">
    <div class="stat-icon stat-icon-violet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>
    <div><div class="stat-value" id="statTotal">—</div><div class="stat-label">Total partners</div></div>
  </div>
  <div class="stat-card">
    <div class="stat-icon stat-icon-green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
    <div><div class="stat-value" id="statAvailable">—</div><div class="stat-label">Available now</div></div>
  </div>
  <div class="stat-card">
    <div class="stat-icon stat-icon-accent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></div>
    <div><div class="stat-value" id="statActive">—</div><div class="stat-label">Active deliveries</div></div>
  </div>
</div>

<div class="layout">

  <div class="panel">
    <h2>Add a partner</h2>
    <form id="partnerForm">
      <label for="name">Full name</label>
      <input type="text" id="name" required>

      <label for="phone">Phone number</label>
      <input type="tel" id="phone" required>

      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="vehicleType">Vehicle type</label>
      <select id="vehicleType" required>
        <option value="Bike">Bike</option>
        <option value="Scooter">Scooter</option>
        <option value="Van">Van</option>
      </select>

      <label for="city">City</label>
      <input type="text" id="city" required>

      <button type="submit" class="btn" id="submitBtn">Add partner</button>
      <p class="form-error" id="formError"></p>
      <p class="form-success" id="formSuccess"></p>
    </form>
  </div>

  <div>
  <div class="filter-tabs" id="statusFilterTabs">
    <button type="button" class="filter-tab active" data-status="all">All</button>
    <button type="button" class="filter-tab" data-status="available">Available</button>
    <button type="button" class="filter-tab" data-status="busy">Busy</button>
    <button type="button" class="filter-tab" data-status="offline">Offline</button>
  </div>
  <div class="partner-grid" id="partnerGrid">
    <p class="loading">Loading partners…</p>
  </div>
  </div>

</div>

<footer>Quantum Drift — Delivery Partner Management System</footer>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>

let allPartners = [];
let currentPartnerFilter = "all";

async function loadPartners() {
  const grid = document.getElementById("partnerGrid");

  const { data, error } = await sb
    .from("partner_workload")
    .select("*")
    .order("joined_at", { ascending: false });

  if (error) {
    grid.innerHTML = "<p class='error'>Could not load partners — " + error.message + "</p>";
    return;
  }

  allPartners = data || [];
  updateStats(allPartners);
  renderPartnerGrid(filteredPartners());
}

function partnerMatchesFilter(partner, filter) {
  if (filter === "all") return true;
  const cls = statusClass(partner.status);
  if (filter === "busy") return cls === "badge-busy" || cls === "badge-onduty";
  return cls === "badge-" + filter;
}

function filteredPartners() {
  return allPartners.filter(function (p) { return partnerMatchesFilter(p, currentPartnerFilter); });
}

function renderPartnerGrid(data) {
  const grid = document.getElementById("partnerGrid");

  if (!data || data.length === 0) {
    grid.innerHTML = "<p class='empty'>No partners match this filter.</p>";
    return;
  }

  grid.innerHTML = "";
  for (let i = 0; i < data.length; i++) {
    grid.appendChild(buildPartnerCard(data[i]));
  }
}

document.querySelectorAll("#statusFilterTabs .filter-tab").forEach(function (btn) {
  btn.addEventListener("click", function () {
    document.querySelectorAll("#statusFilterTabs .filter-tab").forEach(function (b) { b.classList.remove("active"); });
    btn.classList.add("active");
    currentPartnerFilter = btn.dataset.status;
    renderPartnerGrid(filteredPartners());
  });
});

function updateStats(partners) {
  const total = partners.length;
  let available = 0;
  let active = 0;
  for (let i = 0; i < partners.length; i++) {
    if (partners[i].status === "Available") available++;
    active += partners[i].active_deliveries;
  }
  animateValue(document.getElementById("statTotal"), total, 600);
  animateValue(document.getElementById("statAvailable"), available, 600);
  animateValue(document.getElementById("statActive"), active, 600);
}

function buildPartnerCard(partner) {
  const card = document.createElement("div");
  card.className = "partner-card " + statusClass(partner.status);

  const initials = partner.name.split(" ").map(function (w) { return w[0]; }).slice(0, 2).join("").toUpperCase();

  card.innerHTML =
    '<div class="partner-left">' +
      '<div class="avatar">' + initials + '</div>' +
      '<div>' +
        '<div class="partner-name">' + partner.name + '</div>' +
        '<div class="partner-meta">' + partner.vehicle_type + ' • ' + partner.city + ' • ' + partner.phone + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="partner-right">' +
      '<div class="workload">' + partner.active_deliveries + ' active</div>' +
      '<span class="badge ' + statusClass(partner.status) + '">' + partner.status + '</span>' +
    '</div>';

  return card;
}

document.getElementById("partnerForm").addEventListener("submit", async function (e) {
  e.preventDefault();

  const btn = document.getElementById("submitBtn");
  const errorEl = document.getElementById("formError");
  const successEl = document.getElementById("formSuccess");
  btn.disabled = true;
  btn.textContent = "Adding…";
  errorEl.textContent = "";
  successEl.textContent = "";

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const email = document.getElementById("email").value.trim();
  const vehicleType = document.getElementById("vehicleType").value;
  const city = document.getElementById("city").value.trim();

  const { error } = await sb
    .from("partners")
    .insert([{ name: name, phone: phone, email: email, vehicle_type: vehicleType, city: city }]);

  btn.disabled = false;
  btn.textContent = "Add partner";

  if (error) {
    errorEl.textContent = "Something went wrong — " + error.message;
    return;
  }

  successEl.textContent = "Partner added successfully.";
  document.getElementById("partnerForm").reset();
  loadPartners();
});

document.getElementById("logoutLink").addEventListener("click", function (e) {
  e.preventDefault();
  logout();
});

(async function init() {
  const session = await requireAuth();
  if (!session) return;
  loadPartners();
})();
</script>
</body>
</html>
